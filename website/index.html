<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nice - Simple Button Service</title>
    <meta name="description" content="Likes suck! "Nice" everything instead.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nice.sbs/">
    <meta property="og:title" content="Nice - Simple Button Service">
    <meta property="og:description" content="Likes suck! "Nice" everything instead.">
    <meta property="og:image" content="https://nice.sbs/og-image.png">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Nice - Simple Button Service">
    <meta name="twitter:description" content="Likes suck! "Nice" everything instead.">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=block" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            text-align: center;
        }

        .header-nav {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .get-started {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fbbf24;
            color: #000;
            font-family: 'Bungee', cursive;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .get-started:hover {
            transform: scale(1.05);
            background: #f59e0b;
        }

        .get-started:active {
            transform: scale(0.95);
        }

        .github-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            text-decoration: none;
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .github-link:hover {
            transform: scale(1.05);
            color: #fbbf24;
        }

        .github-link:active {
            transform: scale(0.95);
        }

        .github-link svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .hero {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-title {
            font-family: 'Bungee', cursive;
            font-size: clamp(24px, 7vw, 72px);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            perspective: 600px;
            max-width: 100%;
        }

        .rotating-word-slot {
            display: grid;
        }

        .rotating-word-slot > * {
            grid-area: 1 / 1;
        }

        .rotating-word-sizer {
            visibility: hidden;
            pointer-events: none;
        }

        .rotating-word-sizer,
        .rotating-word {
            font: inherit;
            font-family: 'Bungee', cursive;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            background: #fbbf24;
            color: #000;
            border: none;
            /* Match size-md nice button radius (0.5em) and vertical padding scale;
               keep horizontal padding tighter so the hero chip stays word-sized. */
            border-radius: 0.5em;
            padding: 0.5em 0.55em;
            line-height: 1.1;
        }

        .rotating-word {
            cursor: pointer;
            transition: transform 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .rotating-word:hover {
            transform: scale(1.05);
        }

        .rotating-word:active {
            transform: scale(0.95);
        }

        .rotating-word:focus-visible {
            outline: 2px solid #fbbf24;
            outline-offset: 4px;
        }

        /* Flip runs on an inner face so hover scale never fights the animation. */
        .rotating-word-face {
            display: block;
            transform-origin: center;
        }

        .button-word {
            font-size: 18px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 18px;
            color: #9ca3af;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .homepage-button {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 100px;
            min-height: 36px;
        }

        @keyframes flip-word {
            0% {
                opacity: 1;
                transform: rotateX(0deg);
            }
            45% {
                opacity: 0;
                transform: rotateX(90deg);
            }
            55% {
                opacity: 0;
                transform: rotateX(-90deg);
            }
            100% {
                opacity: 1;
                transform: rotateX(0deg);
            }
        }

        .rotating-word.is-flipping .rotating-word-face {
            animation: flip-word 300ms ease-in-out;
        }

        @media (prefers-reduced-motion: reduce) {
            .rotating-word.is-flipping .rotating-word-face {
                animation: none;
            }

            .rotating-word:hover,
            .rotating-word:active {
                transform: none;
            }
        }

        @media (max-width: 600px) {
            .header-nav {
                top: 16px;
                right: 16px;
                gap: 8px;
            }
            .get-started {
                font-size: 12px;
                padding: 8px 16px;
            }
            .github-link {
                width: 32px;
                height: 32px;
            }
            .github-link svg {
                width: 22px;
                height: 22px;
            }
        }

        .footer {
            position: fixed;
            bottom: 16px;
            font-size: 12px;
            color: #555;
        }

        .footer a {
            color: #888;
            text-decoration: none;
        }

        .footer a:hover {
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <nav class="header-nav">
        <a href="https://github.com/GoodEggStudios/nice" class="github-link" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
            </svg>
        </a>
        <a href="/create" class="get-started">CREATE →</a>
    </nav>

    <main class="hero">
        <h1 class="hero-title">
            <span class="rotating-word-slot">
                <span class="rotating-word-sizer" aria-hidden="true">Awesome</span>
                <button type="button" id="rotatingWord" class="rotating-word"><span class="rotating-word-face">Nice</span></button>
            </span>
        </h1>
        <p class="button-word">button</p>
        <p class="tagline">Create your own feedback buttons</p>
        <div class="homepage-button">
            <script src="https://api.nice.sbs/embed.js" data-button="n_iSoPXADYGp0Q" data-theme="dark" data-size="md" data-confetti async></script>
        </div>
    </main>

    <div class="footer">
        built with ❤️ by <a href="https://bsky.app/profile/daio.io" target="_blank" rel="noopener">Dai</a>
    </div>

    <script>
        (() => {
            const HOMEPAGE_BUTTON_ID = "n_iSoPXADYGp0Q";
            const EMBED_ORIGIN = "https://api.nice.sbs";
            const ROTATING_WORDS = [
                "Nice",
                "Awesome",
                "Cool",
                "Spicey",
                "Sucks",
                "Rocks",
                "Slaps",
                "Rules",
                "Hits",
                "Fire",
                "Gross",
                "Flops",
                "Stinks",
                "Mid",
                "Lame"
            ];
            const HOLD_MS = 2500;
            const FLIP_MS = 300;
            let currentIndex = 0;
            let holdTimeoutId = null;
            let swapTimeoutId = null;
            let finishTimeoutId = null;
            // Parent-page API invoke: production embeds may lack nice-invoke, and
            // Cloudflare Pages previews are not on nice.sbs (domain-restricted).
            // Call the public multi endpoint as the official homepage button.
            let homepageNiceInFlight = false;

            const rotatingWord = document.getElementById("rotatingWord");
            if (!rotatingWord) return;
            const rotatingWordFace =
                rotatingWord.querySelector(".rotating-word-face") || rotatingWord;

            function getHomepageFingerprint() {
                const data = [
                    screen.width + "x" + screen.height,
                    new Date().getTimezoneOffset(),
                    navigator.language,
                    navigator.userAgent.slice(0, 50),
                ].join("|");
                let hash = 0;
                for (let i = 0; i < data.length; i++) {
                    hash = ((hash << 5) - hash) + data.charCodeAt(i);
                    hash = hash & hash;
                }
                return hash.toString(36);
            }

            function homepageIframe() {
                return document.querySelector(".homepage-button iframe");
            }

            // Prefer in-embed invoke on hosts the button allows — that updates
            // the count with the normal pop animation instead of reloading.
            function canUseNiceInvoke() {
                const host = location.hostname;
                return host === "nice.sbs" || host === "www.nice.sbs"
                    || host === "localhost" || host === "127.0.0.1";
            }

            function waitForEmbedAck(timeoutMs) {
                return new Promise((resolve) => {
                    let settled = false;
                    const finish = (value) => {
                        if (settled) return;
                        settled = true;
                        window.clearTimeout(timer);
                        window.removeEventListener("message", onMessage);
                        resolve(value);
                    };
                    const onMessage = (event) => {
                        if (event.origin !== EMBED_ORIGIN) return;
                        const data = event.data;
                        if (!data || data.buttonId !== HOMEPAGE_BUTTON_ID) return;
                        if (data.type === "nice-clicked" || data.type === "nice-recorded") {
                            finish(true);
                        }
                    };
                    const timer = window.setTimeout(() => finish(false), timeoutMs);
                    window.addEventListener("message", onMessage);
                });
            }

            function softRefreshHomepageEmbed() {
                const iframe = homepageIframe();
                if (!iframe || !iframe.src) return;
                const reveal = () => {
                    iframe.style.opacity = "1";
                };
                iframe.style.transition = "opacity 120ms ease";
                iframe.style.opacity = "0";
                iframe.addEventListener("load", reveal, { once: true });
                window.setTimeout(reveal, 800);
                try {
                    const url = new URL(iframe.src);
                    url.searchParams.set("_nice", String(Date.now()));
                    iframe.src = url.toString();
                } catch (e) {
                    iframe.src = iframe.src;
                }
            }

            async function invokeHomepageNice() {
                if (homepageNiceInFlight) return;
                homepageNiceInFlight = true;
                try {
                    const iframe = homepageIframe();
                    if (canUseNiceInvoke() && iframe && iframe.contentWindow) {
                        const ack = waitForEmbedAck(450);
                        iframe.contentWindow.postMessage(
                            { type: "nice-invoke", buttonId: HOMEPAGE_BUTTON_ID },
                            EMBED_ORIGIN
                        );
                        if (await ack) return;
                    }

                    // Preview hosts are not nice.sbs (domain-restricted), and
                    // older production embeds may lack nice-invoke. Call multi
                    // with the canonical homepage referrer, then sync the UI.
                    const res = await fetch(
                        EMBED_ORIGIN + "/api/v1/nice/" + HOMEPAGE_BUTTON_ID + "/multi",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                count: 1,
                                fingerprint: getHomepageFingerprint(),
                                referrer: "https://nice.sbs/",
                            }),
                        }
                    );
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && data.success) {
                        softRefreshHomepageEmbed();
                    }
                } catch (e) {
                    // Network failure — leave the hero click retryable.
                } finally {
                    homepageNiceInFlight = false;
                }
            }

            rotatingWord.addEventListener("click", () => {
                void invokeHomepageNice();
            });

            if (ROTATING_WORDS.length < 2 || typeof window.matchMedia !== "function") return;

            const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
            if (
                typeof motionQuery.addEventListener !== "function" &&
                typeof motionQuery.addListener !== "function"
            ) return;

            function pickNextWordIndex() {
                const candidate = Math.floor(Math.random() * (ROTATING_WORDS.length - 1));
                return candidate >= currentIndex ? candidate + 1 : candidate;
            }

            function scheduleNextFlip() {
                if (
                    holdTimeoutId ||
                    swapTimeoutId ||
                    finishTimeoutId ||
                    document.hidden ||
                    motionQuery.matches
                ) return;
                holdTimeoutId = window.setTimeout(startFlip, HOLD_MS);
            }

            function startFlip() {
                holdTimeoutId = null;
                const nextIndex = pickNextWordIndex();
                rotatingWord.classList.add("is-flipping");
                swapTimeoutId = window.setTimeout(() => {
                    swapTimeoutId = null;
                    rotatingWordFace.textContent = ROTATING_WORDS[nextIndex];
                    currentIndex = nextIndex;
                }, FLIP_MS / 2);
                finishTimeoutId = window.setTimeout(() => {
                    finishTimeoutId = null;
                    rotatingWord.classList.remove("is-flipping");
                    scheduleNextFlip();
                }, FLIP_MS);
            }

            function stopCycling() {
                window.clearTimeout(holdTimeoutId);
                window.clearTimeout(swapTimeoutId);
                window.clearTimeout(finishTimeoutId);
                holdTimeoutId = swapTimeoutId = finishTimeoutId = null;
                rotatingWord.classList.remove("is-flipping");
            }

            function syncCycling() {
                stopCycling();
                scheduleNextFlip();
            }

            if (typeof motionQuery.addEventListener === "function") {
                motionQuery.addEventListener("change", syncCycling);
            } else {
                motionQuery.addListener(syncCycling);
            }
            document.addEventListener("visibilitychange", syncCycling);
            window.addEventListener("pagehide", stopCycling);
            window.addEventListener("pageshow", syncCycling);
            syncCycling();
        })();
    </script>
</body>
</html>
